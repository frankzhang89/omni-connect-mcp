name: Build tagged version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: tag-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package runnable JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run all tests
        run: mvn --batch-mode --no-transfer-progress clean verify -DskipTests=false

      - name: Verify runnable JAR and launchers
        run: python3 tests/test_release.py

      - name: Package Windows and Linux distributions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/package_release.py "$RELEASE_VERSION"

      - name: Upload Windows distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omni-connect-mcp-${{ github.ref_name }}-windows
          path: target/dist/*-windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Linux distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omni-connect-mcp-${{ github.ref_name }}-linux
          path: target/dist/*-linux.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          windows_archive="target/dist/omni-connect-mcp-${RELEASE_VERSION}-windows.zip"
          linux_archive="target/dist/omni-connect-mcp-${RELEASE_VERSION}-linux.tar.gz"
          if gh release view "$RELEASE_VERSION" > /dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" "$windows_archive" "$linux_archive" --clobber
          else
            gh release create "$RELEASE_VERSION" "$windows_archive" "$linux_archive" \
              --verify-tag --title "$RELEASE_VERSION" --generate-notes
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-${{ github.ref_name }}
          path: |
            **/target/surefire-reports/
            target/launcher tests with spaces/log/
            target/launcher tests with spaces/capture-*.txt
          if-no-files-found: ignore
          retention-days: 7
